name: Link Check

on:
  push:
    branches: ["**"]
    paths:
      - "**/*.md"
      - ".lycheeignore"
      - ".github/workflows/link-check.yml"
  pull_request:
  schedule:
    # Run weekly to catch externally broken links
    - cron: "0 6 * * 1"

concurrency:
  group: link-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # GITHUB_TOKEN allows lychee to authenticate private GitHub repos
          # without it, private repos return 404 and fail the check
          token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            --verbose
            --no-progress
            --exclude-loopback
            --max-concurrency 8
            --timeout 20
            --github-token ${{ secrets.GITHUB_TOKEN }}
            --exclude-path .github/agents
            "**/*.md"
          fail: true
