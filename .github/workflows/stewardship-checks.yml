name: Stewardship Checks

on:
  push:
    branches: ["**"]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".lycheeignore"
      - ".markdownlint.json"
  pull_request:
  schedule:
    # Weekly drift catch for badge/wiki/schema/relative-link gates
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  group: stewardship-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stewardship:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML (schema parser)
        run: pip install --quiet pyyaml
      - name: Stewardship gates (badge / wiki / schema / relative links)
        run: bash scripts/run_stewardship_checks.sh
      - name: Stewardship gate self-tests
        run: python3 scripts/test_stewardship_gates.py
